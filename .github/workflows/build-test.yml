name: Build App

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      
      - name: Set up pnpm
        uses: pnpm/setup@v3
        with:
          version: 12.21.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run generate
        run: |
          pnpm run generate
      
      - name: Check generated files
        run: |
          if ! git diff --exit-code -- .; then
            echo "The site had changes after generation!"
            git diff
            exit 1
          fi

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "Generation produced untracked files!"
            git ls-files --others --exclude-standard
            exit 1
          fi

          echo "The generated site is up to date"
      
  test-build:
    runs-on: ubuntu-latest
    needs: 
      - test-generate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Set up pnpm
        uses: pnpm/setup@v3
        with:
          version: 12.21.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
    