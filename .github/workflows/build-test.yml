name: Build App

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      
      - uses: pnpm/setup@v1
        with:
          version: 10
          cache: true

      - name: Install dependencies
        working-directory: ./vendor/html-to-image
        run: pnpm install

      - name: Build
        working-directory: ./vendor/html-to-image
        run: npm run build

      - name: Install dependencies
        run: npm ci
      
      - name: Run generate
        run: |
          npm run generate
      
      - name: Check generated files
        run: |
          if ! git diff --exit-code -- .; then
            echo "The site had changes after generation!"
            git diff
            exit 1
          fi

          echo "The generated site is up to date"
      
  test-build:
    runs-on: ubuntu-latest
    needs: 
      - test-generate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: pnpm/setup@v1
        with:
          version: 10
          cache: true

      - name: Install dependencies
        working-directory: ./vendor/html-to-image
        run: pnpm install

      - name: Build
        working-directory: ./vendor/html-to-image
        run: npm run build

      - name: Install dependencies
        run: npm ci
      
      - name: Test build
        run: npm run build
    